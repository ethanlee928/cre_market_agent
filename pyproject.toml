[project]
name = "cre-market-agent"
version = "0.1.0"
description = "London Office Market Monitor — a skills-architected AI agent for CRE market monitoring"
requires-python = ">=3.11"
dependencies = [
    "google-genai>=1.0.0",
    "python-dotenv>=1.0.0",
    "streamlit>=1.40.0",
    "pyyaml>=6.0",
]

# No console_scripts entry point. The surface is the Streamlit app (app.py).
# An earlier draft declared `cre = cre_agent.cli:main`, left over from a CLI
# design that the non-technical-user constraint invalidated. Removed so the
# repo has exactly one entry point.

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/cre_agent"]
