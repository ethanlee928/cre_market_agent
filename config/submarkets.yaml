# Controlled vocabulary for London office submarkets.
# Fixes review finding H4: the seed uses several strings for overlapping places
# ("West End" vs "West End Core (Mayfair/St James's)"). Without a hierarchy an
# asset in Mayfair never matches a signal about the West End, and the relevance
# lens silently returns nothing.

submarkets:
  central_london:
    label: Central London

  city:
    label: City
    parent: central_london
    aliases: ["The City", "City of London", "EC"]
  city_core:
    label: City Core
    parent: city
  city_fringe:
    label: City Fringe
    parent: city
    aliases: ["City Northern Fringe", "Northern Fringe", "EC1", "Clerkenwell", "Shoreditch"]

  west_end:
    label: West End
    parent: central_london
    aliases: ["WE", "W1"]
  west_end_core:
    label: West End Core (Mayfair/St James's)
    parent: west_end
    aliases: ["Mayfair", "St James's", "St James", "West End Core"]
  north_of_oxford_street_east:
    label: North of Oxford Street East
    parent: west_end
    aliases: ["NOX East", "Fitzrovia", "Euston", "NW1"]
  hammersmith:
    label: Hammersmith
    parent: west_end
  vneb:
    label: VNEB
    parent: west_end
    aliases: ["Vauxhall Nine Elms Battersea", "Nine Elms", "Battersea"]

  southbank:
    label: Southbank
    parent: central_london
    aliases: ["South Bank", "SE1"]
  docklands:
    label: Docklands
    parent: central_london
    aliases: ["E14"]
  # Colliers publishes figures for "Canary Wharf", the estate, not for all of
  # Docklands (E14 also covers Wood Wharf's fringes, Poplar, Westferry). Filing
  # estate figures one node too high is the H4 disease in reverse, so the
  # estate gets its own node. The alias moves down with it.
  canary_wharf:
    label: Canary Wharf
    parent: docklands
    aliases: ["Canary Wharf estate"]
  midtown:
    label: Midtown
    parent: central_london
    aliases: ["Holborn", "Covent Garden", "WC1", "WC2"]
  # Regent Quarter (the King's Cross holding) needs somewhere defensible to
  # stand. Some agents file King's Cross under the West End; none of our loaded
  # sources publishes it under anything, so the node hangs off Central London
  # -- the parent we can defend -- and market facts climb there.
  kings_cross:
    label: King's Cross
    parent: central_london
    aliases: ["Kings Cross", "N1C", "King's Cross Central"]
  paddington:
    label: Paddington
    parent: west_end
