# ILLUSTRATIVE PORTFOLIO — these three assets are fictional.
#
# They exist so the relevance lens has something to match against in a demo.
# Every market figure in this application is real and sourced from Savills;
# the holdings below are not. That includes the passing rents, break dates and
# EPC ratings — those are the inputs to the reversion arithmetic on the brief,
# so the figures it computes are real arithmetic over invented rents. The app
# labels the portfolio as illustrative on screen.
#
# In production this is Tier 3 data: the client's own rent roll, which is
# exactly the input no market data vendor can obtain.
#
# Replace with your own assets, or delete every entry: the market-wide view
# works completely with an empty watchlist.

label: "Illustrative portfolio (fictional holdings, real market data)"

assets:
  - name: "120 Fenchurch Street"
    submarket: "City Core"
    grade: "A"
    sqft: 145000
    lease_expiry: "2031-06"
    passing_rent_psf: 68.00
    epc_rating: "B"
    note: "Core City tower, recently refurbished. No break: the expiry is the
      only date on the clock, and it falls outside the delivery window."

  - name: "Mayfair House"
    submarket: "Mayfair"
    grade: "B"
    sqft: 24000
    lease_expiry: "2029-09"
    break_date: "2027-09"
    passing_rent_psf: 82.00
    epc_rating: "D"
    note: "Secondary West End stock, refurbishment decision due"

  - name: "Clerkenwell Works"
    submarket: "City Fringe"
    grade: "B"
    sqft: 38000
    lease_expiry: "2028-03"
    passing_rent_psf: 52.00
    epc_rating: "C"
    note: "Fringe location, exposed to elevated fringe vacancy"

  # The peer-comparison demo asset. The name is invented and collides with no
  # building on the estate roster; the sqft, year, rents and the rateable
  # value below are fictional too. They are the inputs to the building-vs-
  # building card, whose PEERS are real buildings with real VOA figures --
  # which is exactly why the fictional label matters most here.
  - name: "Meridian Quay Tower"
    submarket: "Canary Wharf"
    grade: "A"
    sqft: 260000
    year_built: 2001
    lease_expiry: "2029-03"
    break_date: "2027-12"
    passing_rent_psf: 49.50
    rateable_value_psm: 295.00
    epc_rating: "C"
    note: "Mid-size estate tower, single tenant, break ahead of a heavy
      delivery window. Valued above its street on the 2024 basis."
