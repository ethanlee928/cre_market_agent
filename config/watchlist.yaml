# ILLUSTRATIVE PORTFOLIO — these three assets are fictional.
#
# They exist so the relevance lens has something to match against in a demo.
# Every market figure in this application is real and sourced from Savills;
# the holdings below are not. That includes the passing rents, break dates and
# EPC ratings — those are the inputs to the reversion arithmetic on the brief,
# so the figures it computes are real arithmetic over invented rents. The app
# labels the portfolio as illustrative on screen.
#
# In production this is Tier 3 data: the client's own rent roll, which is
# exactly the input no market data vendor can obtain.
#
# Replace with your own assets, or delete every entry: the market-wide view
# works completely with an empty watchlist.

label: "Illustrative portfolio (fictional holdings, real market data)"

assets:
